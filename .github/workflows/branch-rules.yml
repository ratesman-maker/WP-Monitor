name: Branch Rules

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  validate:
    name: Validate Branch & PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feat|fix|security|refactor|perf|docs|test|chore|release|hotfix)/[a-z0-9-]+$"
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "::error::Branch '$BRANCH' does not match required pattern: $PATTERN"
            echo "Example: feat/add-auth-module"
            exit 1
          fi
          echo "Branch name valid: $BRANCH"

      - name: Validate PR target
        run: |
          BASE="${{ github.base_ref }}"
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" == release/* && "$BASE" != "main" ]]; then
            echo "::error::release/* branches must target main"
            exit 1
          fi
          if [[ "$BRANCH" == hotfix/* && "$BASE" != "main" ]]; then
            echo "::error::hotfix/* branches must target main"
            exit 1
          fi
          echo "PR target valid: $BRANCH -> $BASE"

      - name: Validate PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          PATTERN="^(feat|fix|security|refactor|perf|docs|test|chore|release|hotfix)(\(.+\))?!?: .+"
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title '$TITLE' does not match Conventional Commits format"
            echo "Example: feat(auth): add login page"
            exit 1
          fi
          echo "PR title valid: $TITLE"

  auto-label:
    name: Auto-label PR
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pull-requests: write
    steps:
      - name: Extract type from branch name
        id: type
        run: |
          BRANCH="${{ github.head_ref }}"
          TYPE="${BRANCH%%/*}"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Map type to label
        id: label
        run: |
          case "${{ steps.type.outputs.type }}" in
            feat)       LABEL="feature" ;;
            fix)        LABEL="bug" ;;
            security)   LABEL="security" ;;
            refactor)   LABEL="refactor" ;;
            perf)       LABEL="performance" ;;
            docs)       LABEL="documentation" ;;
            test)       LABEL="testing" ;;
            chore)      LABEL="maintenance" ;;
            release)    LABEL="release" ;;
            hotfix)     LABEL="hotfix" ;;
            *)          LABEL="" ;;
          esac
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Apply label
        if: steps.label.outputs.label != ''
        uses: actions/github-script@v9
        with:
          script: |
            const label = '${{ steps.label.outputs.label }}';
            const issueNumber = context.issue.number;
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [label]
              });
              core.info(`Applied label: ${label}`);
            } catch (error) {
              if (error.status === 404) {
                core.warning(`Label '${label}' does not exist in repo — create it first or sync labels via labels-sync workflow`);
              } else {
                throw error;
              }
            }
