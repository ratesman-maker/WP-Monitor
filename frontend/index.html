<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WP Monitor — WordPress site management dashboard" />
    <title>WP Monitor</title>
    <script>
      // No-flash theme script: runs synchronously before React hydration.
      // Reads localStorage 'wpm-theme' and sets the class on <html> to avoid
      // FOUC (Flash of Unstyled Content) when the user has a light preference.
      // Dark is the default (:root in globals.css), so we only add 'light'.
      (function () {
        try {
          var stored = localStorage.getItem('wpm-theme');
          if (stored === 'light') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          // localStorage may be unavailable (private mode, etc.) — keep default dark
        }
      })();
    </script>
    <script>
      window.__ENV__ = {
        VITE_API_URL: "http://localhost:5173/api",
        VITE_APP_NAME: "WP Monitor",
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
