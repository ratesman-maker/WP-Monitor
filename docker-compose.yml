services:
  db:
    image: mariadb:11.4
    container_name: wp-monitor-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-wp_monitor}
      MARIADB_USER: ${DB_USER:-wp_monitor}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_AUTO_UPGRADE: "true"
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wp-monitor-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-wp_monitor}
      DB_USER: ${DB_USER:-wp_monitor}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_CHARSET: utf8mb4
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/wp-monitor.ini:ro
    networks:
      - default

  web:
    image: nginx:1.27-alpine
    container_name: wp-monitor-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: wp-monitor-frontend
    restart: unless-stopped
    depends_on:
      - web
    environment:
      VITE_API_URL: http://localhost:5173/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - default

volumes:
  db-data:
  frontend-node-modules:

networks:
  default:
    driver: bridge
